# =============================================================================
# Argus MCPS — Bomba de Infusão IoT
# Configuração base Kas (substitui .gitmodules + bblayers.conf + local.conf)
# =============================================================================
header:
  version: 14

machine: raspberrypi3
distro: poky

# =============================================================================
# Repositórios e Layers
# =============================================================================
# Cada repo é baixado e versionado pelo Kas.
# Os commits estão pinados nos hashes testados do branch scarthgap.
# Para atualizar, troque o commit pelo novo hash desejado.
# =============================================================================
repos:

  # Repositório local — a layer deste projeto
  this:
    layers:
      meta-infusion-pump:

  poky:
    url: "https://git.yoctoproject.org/poky"
    branch: scarthgap
    commit: 553530a8acce3b078473c0fa512246a3e84d46bf
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-raspberrypi:
    url: "https://git.yoctoproject.org/meta-raspberrypi"
    branch: scarthgap
    commit: 2c646d29912dcc873469a57b1c207e1549c5094d

  meta-openembedded:
    url: "https://git.openembedded.org/meta-openembedded"
    branch: scarthgap
    commit: e76bf51a92b41d4cb185fc164ae43a863910ccd1
    layers:
      meta-oe:
      meta-python:
      meta-networking:

  meta-rauc:
    url: "https://github.com/rauc/meta-rauc.git"
    branch: scarthgap
    commit: e9d65639be4d8f150fbc7435e2ea399e2671fde1

# =============================================================================
# local.conf
# =============================================================================
# Cada chave gera um bloco no local.conf final.
# O Kas gerencia MACHINE, DISTRO e CONF_VERSION automaticamente.
# =============================================================================
local_conf_header:

  # --- Imagem e Features ---
  features: |
    EXTRA_IMAGE_FEATURES ?= "debug-tweaks"
    IMAGE_FEATURES:append = " ssh-server-dropbear"
    IMAGE_FSTYPES += "wic.gz wic.bmap"

  # --- Build ---
  build: |
    USER_CLASSES ?= "buildstats"
    PATCHRESOLVE = "noop"
    BB_DISKMON_DIRS ??= "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"
    INHERIT += "buildhistory"
    REPRODUCIBLE_MAIN_PACKAGE_STATIC_ID = "1"

  # --- Locale e Timezone ---
  locale: |
    DEFAULT_TIMEZONE = "America/Sao_Paulo"

  # --- Licenças ---
  licenses: |
    LICENSE_FLAGS_ACCEPTED:append = " synaptics-killswitch commercial"

  # --- Rede ---
  network: |
    DISTRO_FEATURES:append = " wifi"

  # --- Kernel ---
  kernel: |
    PREFERRED_VERSION_linux-raspberrypi = "6.1.%"
    KERNEL_IMAGETYPE = "zImage"
    KERNEL_DEVICETREE = " \
        bcm2710-rpi-3-b.dtb \
        bcm2710-rpi-3-b-plus.dtb \
    "

  # --- Systemd (substitui sysvinit) ---
  systemd: |
    INIT_MANAGER = "systemd"
    DISTRO_FEATURES:append = " systemd"
    DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit"
    VIRTUAL-RUNTIME_init_manager = "systemd"
    VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"
    SYSTEMD_AUTO_ENABLE:pn-wpa-supplicant = "enable"

  # --- Hardware: I2C, SPI, UART, PWM ---
  hardware: |
    ENABLE_I2C = "1"
    ENABLE_SPI = "1"
    ENABLE_UART = "1"
    ENABLE_PWM = "1"
    KERNEL_DEVICETREE:append = " overlays/pwm-2chan.dtbo"
    IMAGE_INSTALL:append = " kernel-devicetree"
    DT_OVERLAY_CONFIG:append = " dtparam=audio=off"
    RPI_EXTRA_CONFIG += " \n\
    dtoverlay=spi0-2cs,cs0_pin=8,cs1_pin=7 \n\
    dtparam=pwm=on \n\
    dtoverlay=pwm-2chan \n\
    dtparam=pin=18,func=2 \n\
    dtparam=pin2=19,func2=2 \n\
    "
    RPI_EXTRA_CONFIG += " \n\
    gpio=18=a5 \n\
    "
    KERNEL_MODULE_AUTOLOAD += " pwm-bcm2835 spi-bcm2835 spidev i2c-dev i2c-bcm2835"

  # --- RAUC / U-Boot (OTA A/B) ---
  rauc: |
    DISTRO_FEATURES:append = " rauc"
    RPI_USE_U_BOOT = "1"
